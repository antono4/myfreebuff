[project]
name = "buffstack"
version = "0.1.0"
description = "An OpenHands SDK agent that builds full-stack apps with an HTML dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openhands-sdk>=1.51.0",
    "openhands-tools>=1.51.0",
]

[project.optional-dependencies]
# flask is a runtime dep of the apps BuffStack generates; the test suite imports
# a generated app, so it is needed here too.
dev = ["pytest>=8.0", "flask>=3.0"]

[project.scripts]
buffstack = "buffstack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buffstack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
